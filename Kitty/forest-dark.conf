# Forest Dark color scheme for kitty.
# Dark counterpart of the CustomForest theme:
# https://github.com/sergeylunev/CustomForestTheme
#
# Mirrors the light theme's mostly-monochrome ANSI palette: only red, blue and
# magenta carry hue; black, green, yellow, cyan and white are neutral greys.

foreground              #b0b8a2
background              #1e231b

